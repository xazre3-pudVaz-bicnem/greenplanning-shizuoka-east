name: 毎日の人工芝コラムを生成

on:
  schedule:
    # 日本時間 毎朝 9:30（GitHub Actions は UTC で動くので UTC 00:30 = JST 09:30）
    # 記事の日付は scripts/generate-blog-post.mjs 側で JST に直して決めています。
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ファイルを書かずに、生成される記事の内容だけ確認する'
        type: boolean
        default: false

# GITHUB_TOKEN に push 権限を与える（記事の追加コミットに必要）
permissions:
  contents: write

# 手動実行と定時実行が重なっても、順番に1本ずつ処理する
concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: APIキーが設定されているか確認
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::シークレット ANTHROPIC_API_KEY が設定されていません。"
            echo "リポジトリの Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi
          echo "ANTHROPIC_API_KEY は設定されています。"

      - name: 記事を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # モデル名はコードに固定していません。リポジトリ変数 CLAUDE_MODEL で差し替えられます（未設定なら claude-haiku-4-5）。
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/generate-blog-post.mjs

      - name: 新しい記事があるか確認
        id: check
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain content/blog)" ]; then
            echo "新しい記事はありません（今日の記事はすでにあるか、トピックを書き終えています）。"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            git status --porcelain content/blog
          fi

      - name: 型チェックとビルドで壊れていないか確認
        if: ${{ !inputs.dry_run && steps.check.outputs.has_new == 'true' }}
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          npm run typecheck
          npm run build

      - name: コミットして push
        if: ${{ !inputs.dry_run && steps.check.outputs.has_new == 'true' }}
        run: |
          set -e
          git config user.name  "greenplanning-east-bot"
          git config user.email "actions@github.com"
          git add content/blog
          NEW_FILE=$(git diff --cached --name-only --diff-filter=A | head -n 1)
          git commit -m "コラムを追加: $(basename "${NEW_FILE:-新しい記事}" .md)"

          # 生成中に main が進んでいた場合に備えて、rebase してから push する
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push に失敗しました。${i} 回目の再試行をします。"
            sleep 5
          done
          echo "::error::記事の push に失敗しました。"
          exit 1
